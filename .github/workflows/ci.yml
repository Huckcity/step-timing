name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  actions: read
  contents: read
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: npm test
      - name: Simulate slow work
        run: sleep 3
  timing:
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Step timing report
        uses: ./
        with:
          threshold-seconds: 5
